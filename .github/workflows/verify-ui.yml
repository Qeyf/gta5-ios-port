name: Verify GtaV Mobile UI and translations

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate English and Turkish resources
        run: python3 app/Tests/localization_resources.py
      - name: Validate IPA metadata and private input handling
        run: python3 -m unittest discover -s app/Tests -p '*.py'
      - name: Verify real cheat input sequencing and cancellation
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread -Iapp/Source \
            app/Tests/cheat_input.c -o "$RUNNER_TEMP/check-cheat-input"
          "$RUNNER_TEMP/check-cheat-input"
      - name: Verify loading snapshots and bounded CPU concurrency
        run: |
          for test in loading_state engine_configuration; do
            cc -std=c11 -O2 -Wall -Wextra -Werror -Iapp/Source \
              "app/Tests/$test.c" -o "$RUNNER_TEMP/check-$test"
            "$RUNNER_TEMP/check-$test"
          done
      - name: Verify native wait-queue isolation on Apple Silicon
        run: |
          archive=wabt-1.0.42-macos-arm64.tar.gz
          base=https://github.com/WebAssembly/wabt/releases/download/1.0.42
          curl -fLsS "$base/$archive" -o "$RUNNER_TEMP/futex-wabt.tar.gz"
          expected=$(curl -fLsS "$base/$archive.sha256" | awk '{print $1}')
          actual=$(shasum -a 256 "$RUNNER_TEMP/futex-wabt.tar.gz" | awk '{print $1}')
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/futex-wabt"
          tar -xzf "$RUNNER_TEMP/futex-wabt.tar.gz" -C "$RUNNER_TEMP/futex-wabt" --strip-components=1
          xcrun clang -std=c11 -O2 -pthread -Iapp/Source -I"$RUNNER_TEMP/futex-wabt/include" \
            app/Tests/futex_isolation.c -o "$RUNNER_TEMP/check-futex-isolation"
          for iteration in {1..20}; do "$RUNNER_TEMP/check-futex-isolation"; done
      - name: Verify batched native log persistence
        run: |
          xcrun swiftc app/App/NativeLog.swift app/Tests/native_log.swift -o "$RUNNER_TEMP/check-native-log"
          "$RUNNER_TEMP/check-native-log"
      - name: Verify gyro sampling, gameplay readiness and private report snapshots
        run: |
          for pair in 'MotionRateFilter motion_rate' 'InputPolicy input_policy' 'DiagnosticReport diagnostic_report'; do
            read -r source test <<< "$pair"
            xcrun swiftc "app/App/$source.swift" "app/Tests/$test.swift" -o "$RUNNER_TEMP/check-$test"
            "$RUNNER_TEMP/check-$test"
          done
      - name: Verify production local asset hints and demand reads
        run: bash app/Scripts/check_asset_local_runtime.sh
      - name: Verify diagnostics relay validation and recipient privacy
        run: node --test diagnostics/worker.test.mjs
      - name: Verify Metal suspension and completed upload cache reclamation
        run: |
          for test in render_lifecycle frame_upload_cache frame_timing; do
            c++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -Iapp/Source \
              "app/Tests/$test.cpp" -o "$RUNNER_TEMP/check-$test"
            "$RUNNER_TEMP/check-$test"
          done
      - name: Verify native BC layouts and real Metal texture operations
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iapp/Source \
            app/Tests/native_bc_layout.c -o "$RUNNER_TEMP/check-native-bc-layout"
          "$RUNNER_TEMP/check-native-bc-layout"
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          path = pathlib.Path('app/Tools/bcdec/bcdec.h')
          path.parent.mkdir(parents=True, exist_ok=True)
          with urllib.request.urlopen('https://raw.githubusercontent.com/iOrange/bcdec/80859ed3b7afb1c527a2a99d70c61457bea72d0c/bcdec.h', timeout=30) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != '134520764d96f70a27db814173616c89ad85db95fbd3328417c7a8c77e7ca189':
              raise SystemExit('Pinned BC decoder header checksum mismatch')
          path.write_bytes(data)
          PY
          xcrun clang -std=c11 -O2 -mmacosx-version-min=14.0 \
            -c app/Source/BCTextureDecoder.c -o "$RUNNER_TEMP/bc-decoder.o"
          xcrun clang++ -std=c++20 -O1 -fobjc-arc -fblocks -mmacosx-version-min=14.0 \
            -Iapp/Source -Iapp/Source/MetalRenderer app/Tests/native_bc_metal.mm \
            app/Source/MetalRenderer/MRShaders.mm "$RUNNER_TEMP/bc-decoder.o" \
            -framework Foundation -framework Metal -framework QuartzCore -framework CoreGraphics \
            -framework ImageIO -framework UniformTypeIdentifiers -o "$RUNNER_TEMP/check-native-bc-metal"
          mkdir -p app/Build/UIVerification/launch
          set +e
          MTL_DEBUG_LAYER=1 "$RUNNER_TEMP/check-native-bc-metal" \
            > app/Build/UIVerification/launch/native-bc-metal.log 2>&1
          status=$?
          set -e
          cat app/Build/UIVerification/launch/native-bc-metal.log
          if [ "$status" -eq 77 ]; then
            echo '::warning::Native BC GPU execution skipped: this runner has no capable Metal GPU. Compilation and layout checks passed; device validation remains required.'
            echo 'Native BC GPU execution: **SKIPPED (no capable GPU)**.' >> "$GITHUB_STEP_SUMMARY"
          else
            test "$status" -eq 0
            echo 'Native BC GPU execution: **PASSED with real Metal resources and validation layer**.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compile all Swift UI against the iOS SDK
        run: |
          mkdir -p app/Build/UIVerification/objects app/Build/UIVerification/strings
          cd app/Build/UIVerification/objects
          xcrun --sdk iphoneos swiftc -c -parse-as-library -swift-version 5 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.0 \
            -import-objc-header ../../../Source/Native-Bridging-Header.h \
            -Xcc -I../../../Source -Xcc -I../../../App/GameInstaller \
            -emit-localized-strings -emit-localized-strings-path ../strings \
            ../../../App/*.swift ../../../App/GameInstaller/*.swift
      - name: Compile Apple String Catalogs
        run: |
          mkdir -p app/Build/UIVerification/resources
          for catalog in app/App/*.xcstrings; do
            xcrun xcstringstool compile --output-directory app/Build/UIVerification/resources "$catalog"
          done
      - name: Verify compiled strings have catalog translations
        run: python3 app/Scripts/check_extracted_localizations.py app/Build/UIVerification/strings
      - name: Launch the real UIKit shell on an iOS 27 simulator
        timeout-minutes: 15
        run: |
          bash app/Scripts/verify_ui_launch.sh
          test -s app/Build/UIVerification/launch/verified.txt
      - name: Keep UI launch screenshots and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gtav-ui-launch-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/Build/UIVerification/launch/
          if-no-files-found: ignore
          retention-days: 3
