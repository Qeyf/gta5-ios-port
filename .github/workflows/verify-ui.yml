name: Verify GtaV Mobile UI and translations

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate English and Turkish resources
        run: python3 app/Tests/localization_resources.py
      - name: Validate IPA metadata and private input handling
        run: python3 -m unittest discover -s app/Tests -p '*.py'
      - name: Verify real cheat input sequencing and cancellation
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread -Iapp/Source \
            app/Tests/cheat_input.c -o "$RUNNER_TEMP/check-cheat-input"
          "$RUNNER_TEMP/check-cheat-input"
      - name: Compile all Swift UI against the iOS SDK
        run: |
          mkdir -p app/Build/UIVerification/objects app/Build/UIVerification/strings
          cd app/Build/UIVerification/objects
          xcrun --sdk iphoneos swiftc -c -parse-as-library -swift-version 5 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.0 \
            -import-objc-header ../../../Source/Native-Bridging-Header.h \
            -Xcc -I../../../Source -Xcc -I../../../App/GameInstaller \
            -emit-localized-strings -emit-localized-strings-path ../strings \
            ../../../App/*.swift ../../../App/GameInstaller/*.swift
      - name: Compile Apple String Catalogs
        run: |
          mkdir -p app/Build/UIVerification/resources
          for catalog in app/App/*.xcstrings; do
            xcrun xcstringstool compile --output-directory app/Build/UIVerification/resources "$catalog"
          done
      - name: Verify compiled strings have catalog translations
        run: python3 app/Scripts/check_extracted_localizations.py app/Build/UIVerification/strings
      - name: Launch the real UIKit shell on an iOS 27 simulator
        timeout-minutes: 5
        run: |
          bash app/Scripts/verify_ui_launch.sh
          test -s app/Build/UIVerification/launch/verified.txt
      - name: Keep UI launch screenshots and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gtav-ui-launch-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/Build/UIVerification/launch/
          if-no-files-found: ignore
          retention-days: 3
